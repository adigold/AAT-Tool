name: Feature request
description: An idea that would make the prompt better or the marking faster.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is slow, vague or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
