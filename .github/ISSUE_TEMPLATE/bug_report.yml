name: Bug report
description: Something in AAT does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tray
        2. Pin the ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: The prompt AAT produced (optional)
      description: Remove anything private before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Next.js 15.x, React 19.x, Tailwind CSS 4.x
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS
    validations:
      required: true
